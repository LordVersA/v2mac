name: v2mac
options:
  bundleIdPrefix: io.github.lordversa
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # "owner/name" of the app's GitHub repository; enables the app update check.
    V2MAC_REPOSITORY: "LordVersA/v2mac"
packages:
  V2MacCore:
    path: Packages/V2MacCore
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
targets:
  v2mac:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: V2MacCore
      - target: V2MacControl
      - target: V2MacPrivilegedHelper
        link: false
      - target: V2MacCLI
        link: false
    preBuildScripts:
      - name: Embed Xray core
        script: '"$SRCROOT/Scripts/embed-core.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed privileged helper
        script: '/bin/bash "$SRCROOT/Scripts/embed-privileged-helper.sh"'
        basedOnDependencyAnalysis: false
      - name: Embed command line tool
        script: '/bin/bash "$SRCROOT/Scripts/embed-cli.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac
        PRODUCT_NAME: V2Mac
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/v2mac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug builds are a separate app ("V2MacDev") with their own bundle id, settings and
        # data folder, so they can run next to an installed V2Mac without touching it.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.dev
          PRODUCT_NAME: V2MacDev
          PRODUCT_MODULE_NAME: V2Mac
  V2MacPrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - PrivilegedHelper/HelperDaemon.swift
      - Shared
    dependencies:
      - package: V2MacCore
    settings:
      base:
        PRODUCT_NAME: V2MacPrivilegedHelper
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.privileged
        INFOPLIST_FILE: PrivilegedHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.dev.privileged
  V2MacCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Shared/CLIProtocol.swift
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: v2mac
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.dev.cli
  # The Control Center switch (spec 12.4). WidgetKit needs the extension sandboxed.
  V2MacControl:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/Control
      - App/Support/ControlBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.control
        PRODUCT_NAME: V2MacControl
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extensions/Control/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Control/V2MacControl.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.dev.control
  v2macStateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/V2MacAppTests
      - Shared
      - App/State/ConnectionController.swift
      - App/State/ConnectionWatcher.swift
      - App/Features/Connections/ConnectionGroup.swift
      - App/State/AutomaticLatencyResults.swift
      - App/State/TunController.swift
      - App/State/PrivilegedHelperService.swift
      - App/State/LifecycleMonitor.swift
      - App/State/LogStore.swift
      - App/State/NotificationService.swift
      - App/Features/Settings/SettingsTab.swift
      - App/Features/Settings/AboutSettings.swift
      - App/Support/AppPaths.swift
      - App/Support/AdminConsent.swift
      - App/Support/InstalledApps.swift
      - App/Support/Keychain.swift
      - App/Support/SecretStore.swift
      - App/State/KillSwitchController.swift
      - App/State/SystemProxyController.swift
      - App/Support/ServerName.swift
      - App/Features/CLI/CommandLineToolInstaller.swift
      - App/Models/Profile.swift
      - App/Models/ServerGroup.swift
      - App/Models/GroupColor.swift
      - Packages/V2MacCore/Tests/V2MacCoreTests/TestHTTPServer.swift
    dependencies:
      - package: V2MacCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lordversa.v2mac.state-tests
        TEST_HOST: ""
schemes:
  v2macStateTests:
    build:
      targets:
        v2macStateTests: all
    test:
      targets:
        - v2macStateTests
