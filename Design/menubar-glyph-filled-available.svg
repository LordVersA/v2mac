<svg xmlns="http://www.w3.org/2000/svg" width="22.74pt" height="18pt" viewBox="-30 -30 1090 863">
  <!-- The filled glyph with the update badge in its top right corner: an update was found (an open ring). A clear ring keeps it apart from the bar. -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="-30" y="-30" width="1090" height="863">
      <rect x="-30" y="-30" width="1090" height="863" fill="white"/>
      <polygon points="906,0 661,0 223,803 473,803" fill="black" stroke="black" stroke-width="64" stroke-linejoin="miter"/>
    </mask>
    <mask id="badge" maskUnits="userSpaceOnUse" x="-30" y="-30" width="1090" height="863">
      <rect x="-30" y="-30" width="1090" height="863" fill="white"/>
      <circle cx="890" cy="150" r="250" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#badge)">
  <polygon points="0,0 245,0 683,803 433,803" fill="black" mask="url(#gap)"/>
  <polygon points="906,0 661,0 223,803 473,803" fill="black"/>
  </g>
  <circle cx="890" cy="150" r="135" fill="none" stroke="black" stroke-width="70"/>
</svg>
